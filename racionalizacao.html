<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --bg2:#faf6ee; --card:#fff; --line:#e8dfd1; --line2:#f0e6d4;
  --ink:#2a2620; --ink2:#4a4036; --mut:#76695a; --mut2:#b8a890;
  --acc:#b8651f; --acc-soft:#fff7e8; --navy:#1a3a5c; --navy-soft:#eef3fa;
  --ok:#2d6a4f; --ok-soft:#e8f3ec; --bad:#9a3d2a; --bad-soft:#fce8d6;
  --pur:#5c2d8a; --pur-soft:#f1eaf8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1916; --bg2:#22201c; --card:#28251f; --line:#3a352d; --line2:#332f28;
    --ink:#f1ebe0; --ink2:#ddd3c3; --mut:#b3a691; --mut2:#8a7d69;
    --acc:#e08a45; --acc-soft:#3a2b1c; --navy:#8fb6e0; --navy-soft:#1f2a36;
    --ok:#6fcf97; --ok-soft:#1d3327; --bad:#ef8a73; --bad-soft:#3d231c;
    --pur:#c9a3f0; --pur-soft:#2e2338;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1916; --bg2:#22201c; --card:#28251f; --line:#3a352d; --line2:#332f28;
  --ink:#f1ebe0; --ink2:#ddd3c3; --mut:#b3a691; --mut2:#8a7d69;
  --acc:#e08a45; --acc-soft:#3a2b1c; --navy:#8fb6e0; --navy-soft:#1f2a36;
  --ok:#6fcf97; --ok-soft:#1d3327; --bad:#ef8a73; --bad-soft:#3d231c;
  --pur:#c9a3f0; --pur-soft:#2e2338;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;font-size:16px}
.display{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:500;line-height:1.15;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600}
.brand small{display:block;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.04em}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;background:var(--line2);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
.prog span{font-size:13px;color:var(--mut);white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:28px;padding:24px 20px 60px}
nav.side{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
nav.side .grp{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:16px 0 6px}
nav.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--ink2);padding:7px 10px;border-radius:8px;font-size:14px}
nav.side button:hover{background:var(--card)}
nav.side button.on{background:var(--ink);color:var(--bg)}
nav.side .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mut2);flex:none;display:grid;place-items:center;font-size:11px}
nav.side .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
nav.side .st.star{background:var(--acc);border-color:var(--acc);color:#fff}

main{min-width:0}
.view{display:none}
.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:20px;background:var(--ink);color:var(--bg);margin-bottom:14px}
h1.display{font-size:40px;margin-bottom:8px}
h2.display{font-size:27px;margin:34px 0 10px}
h3{font-size:18px;margin:22px 0 8px}
.sub{font-size:16px;color:var(--mut);max-width:760px;margin-bottom:24px}
p{margin:10px 0;color:var(--ink2);max-width:780px}
ul.l{margin:8px 0 8px 22px;color:var(--ink2)} ul.l li{margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.callout{background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;color:var(--ink2)}
.callout b{color:var(--acc)}
.formula{background:var(--navy-soft);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:19px;color:var(--ink);overflow-x:auto}
.formula .lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;color:var(--ink2)}
.warn b{color:var(--bad)}
.tip{background:var(--pur-soft);border-left:4px solid var(--pur);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;color:var(--ink2)}
.tip b{color:var(--pur)}
.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;min-width:300px;background:var(--card);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--line);padding:8px 14px;text-align:center;font-variant-numeric:tabular-nums}
th{background:var(--bg2);font-size:13px;letter-spacing:.03em}
.big{font-size:21px}

/* matemática */
.mx{white-space:nowrap;font-family:'Cambria Math','STIX Two Math','Times New Roman',Georgia,serif;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 4px 1px}
.fr .de{padding:1px 4px 0}
.rt{display:inline-flex;align-items:flex-end;white-space:nowrap}
.rt .ix{font-size:.62em;align-self:flex-start;margin-right:-.42em;margin-top:-.1em;position:relative;z-index:1}
.rt .rs{font-size:1.1em;line-height:1}
.rt .rc{border-top:1.5px solid currentColor;padding:0 3px 0 2px;margin-left:-1px;line-height:1.2}
.mx sup{font-size:.68em}
.hl{background:#ffd97a55;border-radius:4px;padding:0 3px}
.hl2{background:#8fd3a855;border-radius:4px;padding:0 3px}

/* botões */
.btn{border:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;font-weight:600}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* passo a passo */
.stepper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0}
.stepper .sq{font-weight:600;margin-bottom:6px}
.stepper .sq .tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:6px}
.stepper ol{margin:10px 0 0 0;list-style:none;counter-reset:s}
.stepper li{counter-increment:s;display:none;padding:10px 12px 10px 46px;position:relative;border-top:1px dashed var(--line);color:var(--ink2)}
.stepper li.show{display:block;animation:fade .3s}
.stepper li::before{content:counter(s);position:absolute;left:8px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:13px}
.stepper .hint{font-size:13px;color:var(--mut);margin-top:8px}

details.check{background:var(--ok-soft);border-radius:10px;padding:12px 16px;margin:16px 0;border:1px solid var(--line)}
details.check summary{cursor:pointer;font-weight:600;color:var(--ok)}
details.check summary::marker{color:var(--ok)}
details.check div{margin-top:8px;color:var(--ink2)}

/* quiz */
.quiz{margin-top:10px}
.qq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.qq .qn{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.qq .qt{margin:6px 0 12px;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:10px;font-size:14.5px}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ink2)} .fb.ok b{color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--ink2)} .fb.no b{color:var(--bad)}
.score{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:16px 20px;margin:16px 0;display:none}
.score.show{display:block}
.score .n{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600}

/* trilha */
.trail{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.tcard:hover{border-color:var(--acc)}
.tcard .num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line2);color:var(--ink)}
.tcard.done .num{background:var(--ok);color:#fff}
.tcard.star .num{background:var(--acc);color:#fff}
.tcard .tt{font-weight:600}
.tcard .td{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.badge.hard{background:var(--bad-soft);color:var(--bad)}
.badge.core{background:var(--acc-soft);color:var(--acc)}

/* fluxo de decisão */
.flow{display:grid;gap:10px;margin:16px 0}
.fstep{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:8px}
.fq,.fa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fq{border-left:4px solid var(--navy)}
.fa{border-left:4px solid var(--ok)}
.farrow{text-align:center;font-size:22px;color:var(--mut2)}

/* cartões */
.fc-wrap{perspective:1000px;max-width:560px;margin:20px auto}
.fc{position:relative;height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);font-size:19px}
.fc .front{background:var(--card)}
.fc .back{background:var(--navy-soft);transform:rotateY(180deg)}
.fc .face small{position:absolute;top:12px;left:16px;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.center{text-align:center}

/* jogo */
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px}
.game .gq{font-size:20px;margin:10px 0 16px}
.gstat{display:flex;gap:18px;font-size:14px;color:var(--mut)}
.gstat b{color:var(--ink)}

/* erro */
.esteps{list-style:none;margin:10px 0}
.esteps li{margin:8px 0}
.esteps button{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:16px}
.esteps button:hover:not(:disabled){border-color:var(--acc)}
.esteps button.right{border-color:var(--ok);background:var(--ok-soft)}
.esteps button.wrong{border-color:var(--bad);background:var(--bad-soft)}

.vids{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0}
.vcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.vcard:hover{border-color:var(--acc)}
.vplay{width:52px;height:52px;flex:none;border-radius:12px;background:#d93025;color:#fff;display:grid;place-items:center;font-size:22px}
.vcard .vt{font-weight:600;line-height:1.35}
.vcard .vd{font-size:13px;color:var(--mut);margin-top:3px}
.vemb{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vemb .fw{position:relative;padding-top:56.25%}
.vemb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vemb .vi{padding:10px 14px;font-size:14px}
.vemb .vi a{color:var(--acc)}
@media (max-width:860px){.vids{grid-template-columns:1fr}}
footer{max-width:1180px;margin:0 auto;padding:20px;border-top:1px solid var(--line);font-size:12px;color:var(--mut2)}

/* mobile */
.mnav{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding-top:12px}
  nav.side{display:none}
  .mnav{display:block;padding:0 20px 10px;max-width:1180px;margin:0 auto}
  .mnav select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
  .grid2,.grid3,.trail,.opts{grid-template-columns:1fr}
  h1.display{font-size:30px}
  .fstep{grid-template-columns:1fr;}
  .farrow{transform:rotate(90deg)}
}
</style>
</head>

<script>
/* ============ RENDERIZADOR DE MATEMÁTICA ============
   Notação entre cifrões:  @f{a}{b} = fração · @r{x} = raiz quadrada · @r[n]{x} = raiz de índice n · ^{e} = expoente */
function parseMath(src){
  var i=0, out='';
  function group(){
    if(src[i]!=='{'){ return src[i++]||''; }
    i++; var depth=1, start=i;
    while(i<src.length && depth>0){ if(src[i]==='{')depth++; else if(src[i]==='}')depth--; i++; }
    return src.slice(start,i-1);
  }
  while(i<src.length){
    var c=src[i];
    if(c==='@' && src[i+1]==='f'){ i+=2; var a=group(), b=group();
      out+='<span class="fr"><span class="nu">'+parseMath(a)+'</span><span class="de">'+parseMath(b)+'</span></span>'; }
    else if(c==='@' && src[i+1]==='r'){ i+=2; var n='';
      if(src[i]==='['){ var j=src.indexOf(']',i); n=src.slice(i+1,j); i=j+1; }
      var x=group();
      out+='<span class="rt">'+(n?'<span class="ix">'+n+'</span>':'')+'<span class="rs">√</span><span class="rc">'+parseMath(x)+'</span></span>'; }
    else if(c==='^'){ i++; out+='<sup>'+parseMath(group())+'</sup>'; }
    else { out+=c; i++; }
  }
  return out;
}
function M(s){ return String(s).replace(/\$([^$]+)\$/g,function(_,e){ return '<span class="mx">'+parseMath(e)+'</span>'; }); }

/* ============ PROGRESSO (salvo no navegador) ============ */
var KEY='estudo4-aulas134-141-v1';
var state={done:{},best:{},final:null};
try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object') state=Object.assign(state,p); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ============ CONTEÚDO DAS MISSÕES ============ */
var MISSIONS=[
{id:'m1',bloco:'A',aula:'Aula 134',titulo:'O vocabulário dos polinômios',desc:'Monômio, grau, termo dominante, termo independente',
theory:`
<p>Antes de fazer contas, é preciso saber o <b>nome de cada pedaço</b>. Pense no polinômio como um time: cada jogador (termo) tem uma posição.</p>
<div class="formula"><span class="lbl">Exemplo que vamos dissecar</span>$P(x) = −2x^4 + 3x^2 − x + 7$</div>
<div class="tbl"><table>
<tr><th>Nome</th><th>O que é</th><th>No exemplo</th></tr>
<tr><td><b>Monômio</b></td><td>número × letra com expoente natural (um termo só)</td><td>$3x^2$</td></tr>
<tr><td><b>Termo dominante</b></td><td>o termo com o <b>maior expoente</b></td><td>$−2x^4$</td></tr>
<tr><td><b>Grau</b> (∂P)</td><td>o expoente do termo dominante</td><td>4</td></tr>
<tr><td><b>Coeficiente dominante</b></td><td>o número que acompanha o termo dominante</td><td>−2</td></tr>
<tr><td><b>Termo independente</b></td><td>o termo <b>sem letra</b></td><td>7</td></tr>
</table></div>
<h3>Quantos termos ele tem?</h3>
<ul class="l">
<li><b>Monômio</b>: 1 termo → $5x^3$</li>
<li><b>Binômio</b>: 2 termos não semelhantes → $5x^3 + 2x$</li>
<li><b>Trinômio</b>: 3 termos não semelhantes → $x^2 − 4x + 1$</li>
</ul>
<h3>Monômios semelhantes</h3>
<p>São os que têm <b>a mesma parte de letras, com os mesmos expoentes</b>. Só eles podem ser somados entre si.</p>
<ul class="l"><li>$3x^2$ e $−8x^2$ → <b>semelhantes</b> (os dois têm $x^2$)</li><li>$3x^2$ e $3x$ → <b>não</b> semelhantes ($x^2$ ≠ $x$)</li></ul>
<div class="callout"><b>Polinômio nulo:</b> é o número zero. Ele <b>não tem grau</b>.</div>
<div class="tip"><b>Macete do grau:</b> procure o $x$ com o expoente mais alto, <b>não</b> o primeiro termo. O polinômio pode estar fora de ordem! Em $3x + 5x^4 − 1$ o grau é 4, e o coeficiente dominante é 5.</div>
<details class="check"><summary>Pense rápido: qual é o grau e o termo independente de $Q(x) = 6 − x^2 + 4x^3$?</summary><div>Grau <b>3</b> (o maior expoente é o de $4x^3$) e termo independente <b>6</b>. O coeficiente dominante é <b>4</b>.</div></details>
`,
quiz:[
{q:'Qual é o grau de $P(x) = −2x^4 + 3x^2 − x + 7$?',o:['4','2','7','−2'],a:0,e:'O grau é o maior expoente da variável: $x^4$ → grau 4.'},
{q:'E o coeficiente dominante desse mesmo $P(x)$?',o:['−2','7','4','3'],a:0,e:'O termo dominante é $−2x^4$; o número que o acompanha é −2 (com o sinal!).'},
{q:'Qual é o termo independente de $P(x) = −2x^4 + 3x^2 − x + 7$?',o:['7','−2','3','Não tem'],a:0,e:'Termo independente é o termo sem letra: 7.'},
{q:'$5x^3 + 2x$ é um:',o:['binômio','monômio','trinômio','polinômio nulo'],a:0,e:'São 2 termos não semelhantes ($x^3$ e $x$) → binômio.'},
{q:'Qual par é de monômios <b>semelhantes</b>?',o:['$4x^2$ e $−x^2$','$4x^2$ e $4x$','$x^3$ e $3x$','$2x$ e $2$'],a:0,e:'Semelhantes têm a mesma parte literal com o mesmo expoente: os dois têm $x^2$.'}
]},

{id:'m2',bloco:'A',aula:'Aula 134',titulo:'Operações com polinômios',desc:'Somar, subtrair, multiplicar e o grau do resultado',
theory:`
<p>Vamos usar estes três polinômios em todos os exemplos:</p>
<div class="formula">$P(x) = x + 2$ &nbsp;&nbsp;·&nbsp;&nbsp; $Q(x) = 2x^2 − 3x$ &nbsp;&nbsp;·&nbsp;&nbsp; $R(x) = −x^3 + x^2 + 5$</div>
<h3>1. Somar: junte os semelhantes</h3>
<p>$P + Q = (x + 2) + (2x^2 − 3x) = 2x^2 + (x − 3x) + 2 = $ <b>$2x^2 − 2x + 2$</b></p>
<h3>2. Subtrair: o "menos" entra em todos</h3>
<div class="warn"><b>Erro clássico:</b> trocar o sinal só do primeiro termo. O sinal de menos na frente do parêntese troca o sinal de <b>todos</b> os termos de dentro.</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Calcule $Q − R$</div><ol>
<li>Escreva com parênteses: $(2x^2 − 3x) − (−x^3 + x^2 + 5)$</li>
<li>O menos troca todos os sinais do segundo: $2x^2 − 3x + x^3 − x^2 − 5$</li>
<li>Junte os semelhantes, do maior expoente para o menor: $x^3 + (2x^2 − x^2) − 3x − 5$</li>
<li>Resposta: <b>$x^3 + x^2 − 3x − 5$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Tente fazer o passo no caderno antes de clicar.</div></div>
<h3>3. Multiplicar por um número</h3>
<p>Multiplique cada termo: $3 · P(x) = 3 · (x + 2) = $ <b>$3x + 6$</b></p>
<h3>4. Multiplicar dois polinômios: o "chuveirinho"</h3>
<p>Cada termo do primeiro multiplica <b>todos</b> os termos do segundo. Nas letras, os <b>expoentes se somam</b>: $x · x^3 = x^4$.</p>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Calcule $P(x) · R(x) = (x + 2)(−x^3 + x^2 + 5)$</div><ol>
<li>O $x$ multiplica todos: $x·(−x^3) + x·x^2 + x·5 = −x^4 + x^3 + 5x$</li>
<li>O $2$ multiplica todos: $2·(−x^3) + 2·x^2 + 2·5 = −2x^3 + 2x^2 + 10$</li>
<li>Junte tudo: $−x^4 + x^3 − 2x^3 + 2x^2 + 5x + 10$</li>
<li>Some os semelhantes ($x^3 − 2x^3 = −x^3$): <b>$−x^4 − x^3 + 2x^2 + 5x + 10$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<h3>5. O grau do resultado (sem fazer a conta!)</h3>
<div class="formula"><span class="lbl">Regras do grau</span>Multiplicou → <b>soma os graus</b>: ∂(A·B) = ∂A + ∂B<br>Somou ou subtraiu → <b>no máximo o maior grau</b>: ∂(A ± B) ≤ maior entre ∂A e ∂B</div>
<p>Por que "no máximo"? Porque os termos dominantes podem se cancelar: $(x^2 + 1) + (−x^2 + 3x) = 3x + 1$ tem grau 1, não 2.</p>
<div class="tip"><b>Macete:</b> no produto, os graus se <b>somam</b> (como os expoentes). Na soma, <b>vence o maior</b>, a não ser que haja empate e os dominantes se anulem.</div>
<h3>6. Polinômio identicamente nulo</h3>
<p>Um polinômio é "identicamente nulo" quando vale zero para qualquer $x$. Isso só acontece se <b>todos os coeficientes forem zero</b>.</p>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>$(a − 2)x^2 + (a + b)x + (c − 1)$ é identicamente nulo. Ache $a$, $b$ e $c$.</div><ol>
<li>Cada coeficiente é zero: $a − 2 = 0$, $a + b = 0$, $c − 1 = 0$</li>
<li>Da primeira: $a = 2$</li>
<li>Coloque na segunda: $2 + b = 0 → b = −2$</li>
<li>Da terceira: $c = 1$. Resposta: <b>a = 2, b = −2, c = 1</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
`,
quiz:[
{q:'Quanto é $(2x^2 + 3x − 1) + (x^2 − 5x + 4)$?',o:['$3x^2 − 2x + 3$','$3x^2 + 8x + 3$','$3x^2 − 2x − 5$','$2x^4 − 2x + 3$'],a:0,e:'Junte os semelhantes: $2x^2 + x^2 = 3x^2$; $3x − 5x = −2x$; $−1 + 4 = 3$. Na soma, os expoentes não mudam.'},
{q:'Quanto é $(x + 3)(x − 2)$?',o:['$x^2 + x − 6$','$x^2 − 6$','$x^2 − x − 6$','$x^2 + 5x − 6$'],a:0,e:'Chuveirinho: $x·x − 2x + 3x − 6 = x^2 + x − 6$.'},
{q:'Se ∂A = 3 e ∂B = 5, qual é o grau de $A · B$?',o:['8','15','5','3'],a:0,e:'No produto, os graus se somam: 3 + 5 = 8.'},
{q:'Se ∂P = 3 e ∂R = 6, o que podemos afirmar sobre o grau de $G = P·P + R$?',o:['É no máximo 6','É exatamente 12','É exatamente 9','É exatamente 3'],a:0,e:'$P·P$ tem grau 3 + 3 = 6. Somando com R (grau 6), o resultado tem grau no máximo 6, porque os termos dominantes podem se cancelar.'},
{q:'$(a − 3)x^2 + (b + 2)x + (c − 5)$ é identicamente nulo. Quanto vale $a + b + c$?',o:['6','10','0','−6'],a:0,e:'Todos os coeficientes são zero: a = 3, b = −2, c = 5. Soma: 3 − 2 + 5 = 6.'}
]},

{id:'m3',bloco:'B',aula:'Aula 135',titulo:'Racionalizar: raiz quadrada',desc:'A ideia do "1 disfarçado"',
theory:`
<p><b>Racionalizar</b> é tirar a raiz do denominador (a parte de baixo da fração) <b>sem mudar o valor</b> da fração.</p>
<div class="callout"><b>A grande ideia — o "1 disfarçado":</b> multiplicar qualquer número por 1 não muda nada. E $@f{@r{3}}{@r{3}}$ é exatamente 1! Então podemos multiplicar a fração por ele à vontade.</div>
<h3>A ferramenta que faz a raiz sumir</h3>
<div class="formula"><span class="lbl">Raiz vezes ela mesma</span>$@r{a} · @r{a} = a$ &nbsp;&nbsp;&nbsp; por exemplo: $@r{3}·@r{3} = 3$, &nbsp; $@r{7}·@r{7} = 7$</div>
<div class="formula"><span class="lbl">Regra I</span>$@f{k}{@r{a}} = @f{k}{@r{a}} · @f{@r{a}}{@r{a}} = @f{k@r{a}}{a}$</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{5}{@r{3}}$</div><ol>
<li>Pergunta-chave: <i>o que falta para a raiz de baixo sumir?</i> Outra $@r{3}$.</li>
<li>Multiplique em cima <b>e</b> embaixo: $@f{5}{@r{3}} · @f{@r{3}}{@r{3}}$</li>
<li>Em cima: $5@r{3}$. Embaixo: $@r{3}·@r{3} = 3$</li>
<li>Resposta: <b>$@f{5@r{3}}{3}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Tente fazer o passo no caderno antes de clicar.</div></div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{6}{@r{2}}$ — e simplifique!</div><ol>
<li>Multiplique por $@f{@r{2}}{@r{2}}$: $@f{6@r{2}}{2}$</li>
<li>6 e 2 podem ser divididos por 2: $@f{6}{2} = 3$</li>
<li>Resposta: <b>$3@r{2}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<div class="tip"><b>Sempre olhe se dá para simplificar no final.</b> O número de fora da raiz (em cima) pode ser dividido pelo número de baixo. <b>Nunca</b> simplifique um número de dentro da raiz com um de fora.</div>
<h3>E quando tem sinal de menos?</h3>
<p>O sinal vai para a frente da fração e segue normalmente:</p>
<p class="big">$@f{4}{−@r{2}} = −@f{4}{@r{2}} = −@f{4@r{2}}{2} = −2@r{2}$</p>
<p class="big">$−@f{3}{@r{3}} = −@f{3@r{3}}{3} = −@r{3}$</p>
<div class="warn"><b>Erros mais comuns:</b> (1) multiplicar só embaixo e esquecer em cima; (2) escrever $@r{3}·@r{3} = 9$ (o certo é 3; quem dá 9 é $3·3$).</div>
<details class="check"><summary>Pense rápido: racionalize $@f{1}{@r{15}}$</summary><div>$@f{1}{@r{15}} · @f{@r{15}}{@r{15}} = @f{@r{15}}{15}$. Não dá para simplificar.</div></details>
`,
quiz:[
{q:'Racionalize $@f{5}{@r{3}}$:',o:['$@f{5@r{3}}{3}$','$5@r{3}$','$@f{5}{3}$','$@f{@r{15}}{3}$'],a:0,e:'Multiplicamos por $@f{@r{3}}{@r{3}}$: em cima fica $5@r{3}$, embaixo $@r{3}·@r{3}=3$.'},
{q:'Racionalize $@f{6}{@r{2}}$:',o:['$3@r{2}$','$6@r{2}$','$@r{12}$','$3$'],a:0,e:'$@f{6@r{2}}{2}$ e depois simplifica 6 ÷ 2 = 3 → $3@r{2}$.'},
{q:'Por que podemos multiplicar a fração por $@f{@r{a}}{@r{a}}$?',o:['Porque vale 1 e não muda o valor','Porque deixa o número maior','Porque a raiz some de cima','Porque é uma regra decorada'],a:0,e:'$@f{@r{a}}{@r{a}} = 1$. Multiplicar por 1 muda só a "roupa" da fração, não o valor.'},
{q:'Racionalize $@f{4}{−@r{2}}$:',o:['$−2@r{2}$','$2@r{2}$','$−4@r{2}$','$−@f{@r{2}}{2}$'],a:0,e:'$−@f{4@r{2}}{2} = −2@r{2}$. O sinal de menos fica na frente.'},
{q:'Racionalize $−@f{3}{@r{3}}$:',o:['$−@r{3}$','$@r{3}$','$−3@r{3}$','$−1$'],a:0,e:'$−@f{3@r{3}}{3} = −@r{3}$ (3 ÷ 3 = 1).'}
]},

{id:'m4',bloco:'B',aula:'Aula 135',titulo:'Racionalizar: raiz cúbica',desc:'Quando a raiz é de índice 3',
theory:`
<p>Na raiz cúbica a ideia é a mesma, mas multiplicar por ela mesma <b>não basta</b>: precisamos chegar ao expoente 3.</p>
<div class="formula"><span class="lbl">A ferramenta</span>$@r[3]{a} · @r[3]{a^2} = @r[3]{a^3} = a$ &nbsp;&nbsp;&nbsp; por exemplo: $@r[3]{7}·@r[3]{7^2} = @r[3]{7^3} = 7$</div>
<div class="formula"><span class="lbl">Regra II</span>$@f{k}{@r[3]{a}} = @f{k}{@r[3]{a}} · @f{@r[3]{a^2}}{@r[3]{a^2}} = @f{k@r[3]{a^2}}{a}$</div>
<div class="tip"><b>Pense em "quantos faltam para 3":</b> embaixo tem $a^1$; para chegar em $a^3$ faltam 2 → multiplico por $@r[3]{a^2}$.</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{6}{@r[3]{3}}$</div><ol>
<li>Embaixo: $@r[3]{3^1}$. Faltam 2 para chegar no expoente 3 → multiplico por $@r[3]{3^2}$</li>
<li>$@f{6}{@r[3]{3}} · @f{@r[3]{3^2}}{@r[3]{3^2}} = @f{6@r[3]{9}}{@r[3]{3^3}}$</li>
<li>Embaixo: $@r[3]{3^3} = 3$. Fica $@f{6@r[3]{9}}{3}$</li>
<li>Simplifique 6 ÷ 3 = 2. Resposta: <b>$2@r[3]{9}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Tente fazer o passo no caderno antes de clicar.</div></div>
<div class="warn"><b>Erro mais comum:</b> multiplicar por $@r[3]{a}$ (como na raiz quadrada). Aí embaixo fica $@r[3]{a^2}$, e a raiz <b>não</b> some.</div>
<h3>Raiz cúbica de número negativo</h3>
<p>Raiz cúbica de negativo <b>existe</b>: $@r[3]{−8} = −2$, porque $(−2)^3 = −8$. Então podemos "tirar o menos para fora": $@r[3]{−2} = −@r[3]{2}$.</p>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido · desafio</span>Racionalize $@f{2}{@r[3]{−2}}$</div><ol>
<li>Tire o menos para fora: $@f{2}{−@r[3]{2}} = −@f{2}{@r[3]{2}}$</li>
<li>Multiplique por $@f{@r[3]{2^2}}{@r[3]{2^2}}$: $−@f{2@r[3]{4}}{2}$</li>
<li>Simplifique 2 ÷ 2 = 1. Resposta: <b>$−@r[3]{4}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<details class="check"><summary>Pense rápido: por quanto multiplico para racionalizar $@f{1}{@r[3]{5}}$?</summary><div>Por $@f{@r[3]{5^2}}{@r[3]{5^2}} = @f{@r[3]{25}}{@r[3]{25}}$. Resultado: $@f{@r[3]{25}}{5}$.</div></details>
`,
quiz:[
{q:'Para racionalizar $@f{1}{@r[3]{7}}$, multiplico em cima e embaixo por:',o:['$@r[3]{7^2}$','$@r[3]{7}$','$@r{7}$','$7$'],a:0,e:'Embaixo tem $7^1$; faltam 2 para chegar em $7^3$ → $@r[3]{7^2}$.'},
{q:'Racionalize $@f{1}{@r[3]{5}}$:',o:['$@f{@r[3]{25}}{5}$','$@f{@r[3]{5}}{5}$','$@f{@r[3]{25}}{25}$','$@f{@r{5}}{5}$'],a:0,e:'$@f{1}{@r[3]{5}}·@f{@r[3]{25}}{@r[3]{25}} = @f{@r[3]{25}}{@r[3]{125}} = @f{@r[3]{25}}{5}$.'},
{q:'Racionalize $@f{6}{@r[3]{3}}$:',o:['$2@r[3]{9}$','$6@r[3]{9}$','$2@r[3]{3}$','$@f{@r[3]{9}}{2}$'],a:0,e:'$@f{6@r[3]{9}}{3} = 2@r[3]{9}$.'},
{q:'Racionalize $@f{11}{@r[3]{11}}$:',o:['$@r[3]{121}$','$11@r[3]{11}$','$@r[3]{11}$','$11$'],a:0,e:'$@f{11@r[3]{121}}{11} = @r[3]{121}$ (11 ÷ 11 = 1).'},
{q:'Racionalize $@f{2}{@r[3]{−2}}$:',o:['$−@r[3]{4}$','$@r[3]{4}$','$−2@r[3]{4}$','$@r[3]{2}$'],a:0,e:'$@r[3]{−2} = −@r[3]{2}$. Então $−@f{2}{@r[3]{2}} = −@f{2@r[3]{4}}{2} = −@r[3]{4}$.'}
]},

{id:'m5',bloco:'B',aula:'Aula 136',titulo:'Racionalizar: raiz de índice n',desc:'A "regra do que falta"',
theory:`
<p>Agora a regra geral, que vale para <b>qualquer</b> índice (4, 5, 7, 12…). Ela junta as duas missões anteriores numa ideia só.</p>
<div class="formula"><span class="lbl">Regra do que falta</span>Se embaixo tem $@r[n]{a^m}$, multiplique por $@r[n]{a^{n−m}}$ &nbsp;→&nbsp; $@r[n]{a^m}·@r[n]{a^{n−m}} = @r[n]{a^n} = a$</div>
<div class="callout"><b>Pergunta-chave:</b> "O índice é n. O expoente de dentro é m. <b>Quanto falta</b> para o expoente chegar em n?" Esse "falta" é o expoente que você vai usar.</div>
<div class="tbl"><table>
<tr><th>Denominador</th><th>Índice n</th><th>Expoente m</th><th>Falta (n − m)</th><th>Multiplico por</th></tr>
<tr><td>$@r[5]{2}$</td><td>5</td><td>1</td><td>4</td><td>$@r[5]{2^4}$</td></tr>
<tr><td>$@r[7]{3^2}$</td><td>7</td><td>2</td><td>5</td><td>$@r[7]{3^5}$</td></tr>
<tr><td>$@r[4]{6}$</td><td>4</td><td>1</td><td>3</td><td>$@r[4]{6^3}$</td></tr>
<tr><td>$@r[7]{7^6}$</td><td>7</td><td>6</td><td>1</td><td>$@r[7]{7}$</td></tr>
</table></div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{3}{@r[5]{2}}$</div><ol>
<li>Índice 5, expoente 1 → faltam 4. Multiplico por $@f{@r[5]{2^4}}{@r[5]{2^4}}$</li>
<li>Embaixo: $@r[5]{2^1}·@r[5]{2^4} = @r[5]{2^5} = 2$</li>
<li>Em cima: $3@r[5]{2^4} = 3@r[5]{16}$</li>
<li>Resposta: <b>$@f{3@r[5]{16}}{2}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Tente fazer o passo no caderno antes de clicar.</div></div>
<h3>Estratégia 1: decomponha o número primeiro</h3>
<p>Se dentro da raiz aparecer 8, 27, 32… <b>escreva como potência</b> antes de tudo: $8 = 2^3$, $27 = 3^3$, $32 = 2^5$. Senão você não enxerga o expoente.</p>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{1}{@r[4]{27}}$</div><ol>
<li>Decomponha: $27 = 3^3$, então $@r[4]{27} = @r[4]{3^3}$</li>
<li>Índice 4, expoente 3 → falta 1. Multiplico por $@f{@r[4]{3}}{@r[4]{3}}$</li>
<li>Embaixo: $@r[4]{3^4} = 3$</li>
<li>Resposta: <b>$@f{@r[4]{3}}{3}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<p>Do mesmo jeito: $@f{1}{@r[5]{8}} = @f{1}{@r[5]{2^3}} → $ falta $2^2$ → $@f{@r[5]{4}}{2}$.</p>
<h3>Estratégia 2: se der, simplifique o índice</h3>
<p>Em $@r[12]{5^9}$, o índice 12 e o expoente 9 podem ser divididos por 3: $@r[12]{5^9} = @r[4]{5^3}$. Aí fica bem mais fácil:</p>
<p class="big">$@f{1}{@r[12]{5^9}} = @f{1}{@r[4]{5^3}} = @f{1}{@r[4]{5^3}}·@f{@r[4]{5}}{@r[4]{5}} = @f{@r[4]{5}}{5}$</p>
<div class="warn"><b>Atenção:</b> o número que vai para baixo no final é o <b>número de dentro</b> ($a$), não a potência. Em $@r[5]{2^5}$ o resultado é <b>2</b>, não 32.</div>
<details class="check"><summary>Pense rápido: racionalize $@f{7}{@r[7]{7^6}}$</summary><div>Falta 1 → multiplico por $@r[7]{7}$. Embaixo fica $@r[7]{7^7} = 7$. Resultado $@f{7@r[7]{7}}{7} = @r[7]{7}$.</div></details>
`,

{q:'Racionalize $@f{1}{@r[4]{3}}$:',o:['$@f{@r[4]{27}}{3}$','$@f{@r[4]{3}}{3}$','$@f{@r[4]{9}}{3}$','$@f{@r[4]{27}}{27}$'],a:0,e:'Falta $3^3$: $@f{@r[4]{3^3}}{@r[4]{3^4}} = @f{@r[4]{27}}{3}$.'},
{q:'Racionalize $@f{1}{@r[4]{27}}$:',o:['$@f{@r[4]{3}}{3}$','$@f{@r[4]{27}}{27}$','$@f{@r[4]{3}}{27}$','$3@r[4]{3}$'],a:0,e:'Decomponha $27 = 3^3$. Falta 1 → multiplico por $@r[4]{3}$ → $@f{@r[4]{3}}{3}$.'},
{q:'Racionalize $@f{7}{@r[7]{7^6}}$:',o:['$@r[7]{7}$','$7@r[7]{7}$','$@r[7]{7^6}$','$1$'],a:0,e:'Falta 1: $@f{7@r[7]{7}}{7} = @r[7]{7}$.'},
{q:'Racionalize $@f{1}{@r[12]{5^9}}$:',o:['$@f{@r[4]{5}}{5}$','$@f{@r[4]{5^3}}{5}$','$@f{@r[12]{5^9}}{5}$','$@f{@r{5}}{5}$'],a:0,e:'Simplifique: $@r[12]{5^9} = @r[4]{5^3}$. Falta 1 → $@f{@r[4]{5}}{5}$.'}
]},

{id:'m6',bloco:'B',aula:'Aula 137',titulo:'Racionalizar com o conjugado',desc:'Denominador do tipo √a + √b ou √a − √b',
theory:`
<p>Quando embaixo tem uma <b>soma ou diferença com raiz</b>, multiplicar pela própria raiz não resolve. Aqui entra um truque com um produto notável.</p>
<div class="formula"><span class="lbl">O produto notável que salva</span>$(x + y)(x − y) = x^2 − y^2$<br>Com raízes: $(@r{a} + @r{b})(@r{a} − @r{b}) = a − b$ &nbsp; ← sem raiz nenhuma!</div>
<div class="callout"><b>Conjugado = "troca o sinal do meio".</b> O conjugado de $@r{7} + @r{3}$ é $@r{7} − @r{3}$. O de $5 − @r{2}$ é $5 + @r{2}$.</div>
<div class="tbl"><table>
<tr><th>Denominador</th><th>Conjugado</th><th>Produto dos dois</th></tr>
<tr><td>$@r{7} + @r{3}$</td><td>$@r{7} − @r{3}$</td><td>7 − 3 = 4</td></tr>
<tr><td>$@r{5} − @r{2}$</td><td>$@r{5} + @r{2}$</td><td>5 − 2 = 3</td></tr>
<tr><td>$3 − @r{5}$</td><td>$3 + @r{5}$</td><td>9 − 5 = 4</td></tr>
<tr><td>$@r{2} − 5$</td><td>$@r{2} + 5$</td><td>2 − 25 = −23</td></tr>
</table></div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{6}{@r{5} + @r{2}}$</div><ol>
<li>Conjugado de baixo: $@r{5} − @r{2}$. Multiplique em cima e embaixo por ele.</li>
<li>Em cima: $6(@r{5} − @r{2})$ — deixe entre parênteses por enquanto</li>
<li>Embaixo: $(@r{5})^2 − (@r{2})^2 = 5 − 2 = 3$</li>
<li>$@f{6(@r{5} − @r{2})}{3}$ → simplifique 6 ÷ 3 = 2</li>
<li>Resposta: <b>$2(@r{5} − @r{2})$</b>, ou seja, $2@r{5} − 2@r{2}$</li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Tente fazer o passo no caderno antes de clicar.</div></div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{@r{2}}{@r{3} + 1}$ (com raiz em cima também)</div><ol>
<li>Conjugado: $@r{3} − 1$</li>
<li>Embaixo: $3 − 1 = 2$</li>
<li>Em cima, distribua: $@r{2}(@r{3} − 1) = @r{6} − @r{2}$</li>
<li>Resposta: <b>$@f{@r{6} − @r{2}}{2}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<div class="warn"><b>Três armadilhas:</b><br>1. Embaixo é <b>menos</b>: $(@r{5}+@r{3})(@r{5}−@r{3}) = 5 − 3$, nunca $5 + 3$.<br>2. $@r{5} + @r{3}$ <b>não</b> é $@r{8}$. Raízes não se somam assim.<br>3. Não esqueça de multiplicar o <b>numerador</b> também.</div>
<div class="tip"><b>Dica de organização:</b> resolva primeiro o denominador (é a parte que "some"). Depois faça o de cima e veja se dá para simplificar.</div>
<details class="check"><summary>Pense rápido: qual é o conjugado de $@r{13} − @r{5}$ e quanto dá o produto?</summary><div>Conjugado: $@r{13} + @r{5}$. Produto: 13 − 5 = <b>8</b>.</div></details>
`,
quiz:[
{q:'Qual é o conjugado de $@r{7} + @r{3}$?',o:['$@r{7} − @r{3}$','$@r{7} + @r{3}$','$−@r{7} − @r{3}$','$@r{10}$'],a:0,e:'Conjugado: troca só o sinal do meio.'},
{q:'Racionalize $@f{1}{@r{5} − @r{3}}$:',o:['$@f{@r{5} + @r{3}}{2}$','$@f{@r{5} + @r{3}}{8}$','$@f{@r{5} − @r{3}}{2}$','$@r{5} + @r{3}$'],a:0,e:'Multiplica por $@r{5}+@r{3}$. Embaixo: 5 − 3 = 2.'},
{q:'Racionalize $@f{4}{@r{7} + @r{3}}$:',o:['$@r{7} − @r{3}$','$@f{@r{7} − @r{3}}{4}$','$4(@r{7} − @r{3})$','$@r{7} + @r{3}$'],a:0,e:'Embaixo: 7 − 3 = 4. Fica $@f{4(@r{7}−@r{3})}{4} = @r{7} − @r{3}$.'},
{q:'Racionalize $@f{10}{5 − @r{5}}$:',o:['$@f{5 + @r{5}}{2}$','$@f{5 + @r{5}}{20}$','$2(5 + @r{5})$','$@f{5 − @r{5}}{2}$'],a:0,e:'Conjugado $5+@r{5}$. Embaixo: 25 − 5 = 20. $@f{10(5+@r{5})}{20} = @f{5+@r{5}}{2}$.'},
{q:'Racionalize $@f{@r{3}}{@r{2} + @r{3}}$:',o:['$3 − @r{6}$','$@r{6} − 3$','$3 + @r{6}$','$@f{3 − @r{6}}{5}$'],a:0,e:'Multiplique por $@r{3} − @r{2}$: embaixo 3 − 2 = 1; em cima $@r{3}(@r{3}−@r{2}) = 3 − @r{6}$.'}
]},

{id:'m7',bloco:'B',aula:'Aula 138',titulo:'Três termos no denominador',desc:'Racionalizar em dois turnos',hard:true,
theory:`
<p>Esta é a missão <b>desafio</b>. Ela usa tudo que você já aprendeu, só que em <b>dois turnos</b>.</p>
<div class="callout"><b>Estratégia dos dois turnos:</b><br>1º turno: junte dois termos num "bloco" e use o conjugado. Sobra só <b>uma</b> raiz embaixo.<br>2º turno: racionalize essa raiz que sobrou (como na missão 3 ou 6).</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Racionalize $@f{1}{@r{2} + @r{3} + @r{5}}$</div><ol>
<li>Faça um bloco: $(@r{2} + @r{3}) + @r{5}$. O conjugado é $(@r{2} + @r{3}) − @r{5}$</li>
<li>Embaixo: $(@r{2} + @r{3})^2 − (@r{5})^2$</li>
<li>$(@r{2} + @r{3})^2 = 2 + 2@r{6} + 3 = 5 + 2@r{6}$. Então embaixo: $5 + 2@r{6} − 5 = 2@r{6}$</li>
<li>Fim do 1º turno: $@f{@r{2} + @r{3} − @r{5}}{2@r{6}}$ — sobrou só uma raiz embaixo!</li>
<li>2º turno: multiplique por $@f{@r{6}}{@r{6}}$. Embaixo: $2·6 = 12$</li>
<li>Em cima: $@r{6}·@r{2} + @r{6}·@r{3} − @r{6}·@r{5} = @r{12} + @r{18} − @r{30} = 2@r{3} + 3@r{2} − @r{30}$</li>
<li>Resposta: <b>$@f{2@r{3} + 3@r{2} − @r{30}}{12}$</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">É uma conta longa. Faça um passo por vez no caderno.</div></div>
<div class="formula"><span class="lbl">Lembre-se do quadrado da soma</span>$(x + y)^2 = x^2 + 2xy + y^2$ &nbsp;→&nbsp; $(1 + @r{2})^2 = 1 + 2@r{2} + 2 = 3 + 2@r{2}$</div>
<div class="tip"><b>Macete para escolher o bloco:</b> tente juntar os termos cujos quadrados somados <b>cancelem</b> com o quadrado do terceiro. No exemplo, 2 + 3 = 5, e o 5 sumiu! Isso deixa a conta bem menor.</div>
<div class="warn"><b>Erro clássico:</b> $(@r{2} + @r{3})^2 ≠ 2 + 3$. Nunca esqueça o termo do meio ($2xy$).</div>
<details class="check"><summary>Pense rápido: quanto é $(1 + @r{2})^2 − (@r{3})^2$?</summary><div>$(3 + 2@r{2}) − 3 = 2@r{2}$. Esse é o 1º turno de $@f{1}{1+@r{2}+@r{3}}$.</div></details>
`,
quiz:[
{q:'Em $@f{1}{1 + @r{2} + @r{3}}$, um bom primeiro passo é multiplicar por:',o:['$(1 + @r{2}) − @r{3}$','$1 + @r{2} + @r{3}$','$@r{3}$','$@r{2}·@r{3}$'],a:0,e:'Fazemos o bloco $(1+@r{2})$ e usamos o conjugado, trocando o sinal do $@r{3}$.'},
{q:'Quanto é $(1 + @r{2})^2$?',o:['$3 + 2@r{2}$','$3$','$1 + 2@r{2}$','$3 + @r{2}$'],a:0,e:'$1^2 + 2·1·@r{2} + (@r{2})^2 = 1 + 2@r{2} + 2 = 3 + 2@r{2}$.'},
{q:'Quantos "turnos" de racionalização são necessários com três termos?',o:['2','1','3','Nenhum'],a:0,e:'O 1º turno (conjugado) deixa uma raiz; o 2º turno elimina essa raiz.'},
{q:'Racionalize $@f{1}{1 + @r{2} + @r{3}}$:',o:['$@f{2 + @r{2} − @r{6}}{4}$','$@f{1 + @r{2} − @r{3}}{2}$','$@f{2 + @r{2} + @r{6}}{4}$','$2 + @r{2} − @r{6}$'],a:0,e:'1º turno: $@f{1+@r{2}−@r{3}}{2@r{2}}$. 2º turno (× $@r{2}$): $@f{@r{2} + 2 − @r{6}}{4}$.'}
]},

{id:'m8',bloco:'C',aula:'Aula 139',titulo:'Média aritmética e ponderada',desc:'Quando todos valem igual e quando têm peso',
theory:`
<h3>Média aritmética: "divide igualmente"</h3>
<div class="formula"><span class="lbl">Fórmula</span>média = $@f{soma dos valores}{quantidade de valores}$</div>
<p>Exemplo: 6, 8, 10 e 12 → $@f{6 + 8 + 10 + 12}{4} = @f{36}{4} = $ <b>9</b></p>
<h3>Média ponderada: "cada um tem um peso"</h3>
<p>Use quando os valores têm <b>importâncias diferentes</b> (provas com pesos) ou <b>quantidades diferentes</b> (3 livros de um preço, 5 de outro).</p>
<div class="formula"><span class="lbl">Fórmula</span>média ponderada = $@f{valor₁·peso₁ + valor₂·peso₂ + …}{peso₁ + peso₂ + …}$</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Notas: 6 (peso 2) e 8 (peso 3). Qual é a média?</div><ol>
<li>Multiplique cada nota pelo peso: $6·2 = 12$ e $8·3 = 24$</li>
<li>Some: $12 + 24 = 36$</li>
<li>Divida pela <b>soma dos pesos</b> (2 + 3 = 5): $@f{36}{5}$</li>
<li>Resposta: <b>7,2</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<div class="warn"><b>Erro mais comum:</b> dividir pela quantidade de notas (2) em vez da <b>soma dos pesos</b> (5).</div>
<h3>Quando a nota que falta é a pergunta</h3>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Provas com pesos 2, 3 e 5. Notas: 6, 5 e x. Que nota x dá média 7?</div><ol>
<li>Monte a conta: $@f{6·2 + 5·3 + x·5}{2 + 3 + 5} = 7$</li>
<li>Simplifique: $@f{12 + 15 + 5x}{10} = 7$</li>
<li>Passe o 10 multiplicando: $27 + 5x = 70$</li>
<li>$5x = 43$ → $x = @f{43}{5}$ = <b>8,6</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<div class="tip"><b>Como lembrar:</b> "ponderada" vem de <i>peso</i>. Se o problema fala em peso, quantidade ou "cada", é média ponderada.</div>
<details class="check"><summary>Pense rápido: comprei 2 cadernos a R&#36; 15 e 3 a R&#36; 10. Qual o preço médio?</summary><div>$@f{2·15 + 3·10}{2 + 3} = @f{60}{5} = $ <b>R&#36; 12</b>. (Atenção: não é 12,50, que seria a média simples de 15 e 10.)</div></details>
`,
quiz:[
{q:'Qual é a média aritmética de 7, 12 e 14?',o:['11','33','12','10'],a:0,e:'(7 + 12 + 14) ÷ 3 = 33 ÷ 3 = 11.'},
{q:'Qual é a média aritmética de 4, 5, 9 e 10?',o:['7','28','6','7,5'],a:0,e:'(4 + 5 + 9 + 10) ÷ 4 = 28 ÷ 4 = 7.'},
{q:'2 cadernos custam R&#36; 15 cada e 3 custam R&#36; 10 cada. Qual é o preço médio?',o:['R&#36; 12,00','R&#36; 12,50','R&#36; 25,00','R&#36; 13,00'],a:0,e:'Média ponderada: (2·15 + 3·10) ÷ 5 = 60 ÷ 5 = 12.'},
{q:'Pesos 2, 3 e 5; notas 6, 5 e x. Para média 7, x deve ser:',o:['8,6','10','7','9,2'],a:0,e:'(12 + 15 + 5x) ÷ 10 = 7 → 27 + 5x = 70 → x = 8,6.'},
{q:'Quando usar média <b>ponderada</b>?',o:['Quando os valores têm pesos ou quantidades diferentes','Sempre que houver mais de 3 números','Só com números decimais','Quando os valores são todos iguais'],a:0,e:'A ponderada leva em conta quanto cada valor "pesa".'}
]},

{id:'m9',bloco:'C',aula:'Aula 140',titulo:'Tabelas de frequência',desc:'Contar, organizar em intervalos e calcular %',
theory:`
<p>Uma <b>tabela de frequência</b> organiza muitos dados para enxergarmos o "jeitão" deles. <b>Frequência</b> = quantas vezes algo aparece.</p>
<h3>Os dados de exemplo</h3>
<p>Pontos de 20 alunos num jogo:</p>
<div class="card mono" style="font-size:16px">12 · 15 · 11 · 18 · 14 · 13 · 16 · 19 · 12 · 15 · 17 · 14 · 11 · 16 · 13 · 18 · 15 · 12 · 14 · 17</div>
<h3>Intervalos: o símbolo ├</h3>
<div class="formula"><span class="lbl">Como ler</span>12 ├ 14 &nbsp;=&nbsp; <b>inclui o 12</b>, <b>não inclui o 14</b> (o 14 vai para o próximo intervalo)</div>
<div class="stepper"><div class="sq"><span class="tag">Passo a passo</span>Montar a tabela com intervalos de tamanho 2</div><ol>
<li>Ache o menor (11) e o maior (19) valor. Comece em 10 e vá de 2 em 2: 10├12, 12├14, 14├16, 16├18, 18├20</li>
<li>Passe pelos dados <b>um por um</b>, fazendo um tracinho no intervalo certo. Risque o número da lista para não contar duas vezes.</li>
<li>Conte os tracinhos de cada linha: essa é a frequência</li>
<li>Confira: a soma das frequências tem que dar o total de dados (20)</li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button></div>
<div class="tbl"><table>
<tr><th>Pontos</th><th>Frequência</th><th>%</th></tr>
<tr><td>10 ├ 12</td><td>2</td><td>10%</td></tr>
<tr><td>12 ├ 14</td><td>5</td><td>25%</td></tr>
<tr><td>14 ├ 16</td><td>6</td><td>30%</td></tr>
<tr><td>16 ├ 18</td><td>4</td><td>20%</td></tr>
<tr><td>18 ├ 20</td><td>3</td><td>15%</td></tr>
<tr><th>Total</th><th>20</th><th>100%</th></tr>
</table></div>
<div class="formula"><span class="lbl">Porcentagem (frequência relativa)</span>% = $@f{frequência}{total}$ × 100 &nbsp;&nbsp; ex.: $@f{6}{20}·100 = 30$%</div>
<div class="tip"><b>Macete com total 50:</b> cada aluno vale 2%. Com total 20: cada um vale 5%. Com total 25: cada um vale 4%.</div>
<h3>O que a tabela ganha e o que ela perde</h3>
<p>A tabela por intervalos mostra rápido <b>onde está a maioria</b>. Mas ela <b>perde detalhe</b>: olhando só "12 ├ 14: 5 alunos", não dá para saber quantos fizeram exatamente 13 pontos. Para isso, só voltando aos dados brutos.</p>
<details class="check"><summary>Pense rápido: numa turma de 50 alunos, 14% têm 13 anos. Quantos alunos são?</summary><div>14% de 50 = $@f{14}{100}·50$ = <b>7 alunos</b>. (Ou: cada aluno vale 2%, então 14 ÷ 2 = 7.)</div></details>
`,
quiz:[
{q:'O valor 14 entra em qual intervalo: 12 ├ 14 ou 14 ├ 16?',o:['14 ├ 16','12 ├ 14','Nos dois','Em nenhum'],a:0,e:'O símbolo ├ inclui o número da esquerda e exclui o da direita. Então 14 fica em 14 ├ 16.'},
{q:'Num total de 20 dados, um intervalo tem frequência 6. Qual é a porcentagem?',o:['30%','6%','60%','12%'],a:0,e:'6 ÷ 20 × 100 = 30%.'},
{q:'Em 50 alunos, 22 têm 12 anos. Que porcentagem é essa?',o:['44%','22%','11%','50%'],a:0,e:'22 ÷ 50 × 100 = 44% (ou 22 × 2%).'},
{q:'Numa tabela de 50 alunos, 14% têm 13 anos. Quantos alunos são?',o:['7','14','28','5'],a:0,e:'14% de 50 = 7.'},
{q:'Só com a tabela por intervalos (12├14: 5 alunos), dá para saber quantos fizeram exatamente 13?',o:['Não, precisa dos dados brutos','Sim, são 5','Sim, é a metade: 2,5','Sim, é sempre 1'],a:0,e:'A tabela agrupa os valores e perde o detalhe de cada um.'}
]},

{id:'m10',bloco:'C',aula:'Aula 141',titulo:'Média de uma tabela (ponto médio)',desc:'Estudo de tendências com classes',
theory:`
<p>E se só tivermos a tabela, sem os dados brutos? Não sabemos o valor exato de cada pessoa, então usamos um <b>representante</b> de cada intervalo: o <b>ponto médio</b>.</p>
<div class="formula"><span class="lbl">Ponto médio da classe a ├ b</span>$m = @f{a + b}{2}$ &nbsp;&nbsp; ex.: 6 ├ 12 → $@f{6 + 12}{2} = 9$</div>
<div class="formula"><span class="lbl">Média da tabela (é uma média ponderada!)</span>média = $@f{f₁·m₁ + f₂·m₂ + …}{total}$ &nbsp;&nbsp; (a frequência faz o papel do peso)</div>
<div class="stepper"><div class="sq"><span class="tag">Exemplo resolvido</span>Horas de estudo por semana de 20 alunos: 0├2: 5 · 2├4: 8 · 4├6: 5 · 6├8: 2. Qual é a média?</div><ol>
<li>Pontos médios: 0├2 → 1 · 2├4 → 3 · 4├6 → 5 · 6├8 → 7</li>
<li>Multiplique frequência × ponto médio: $5·1 = 5$; $8·3 = 24$; $5·5 = 25$; $2·7 = 14$</li>
<li>Some: $5 + 24 + 25 + 14 = 68$</li>
<li>Divida pelo total (20): $@f{68}{20}$ = <b>3,4 horas</b></li>
</ol><button class="btn ghost nxt">Mostrar próximo passo</button><div class="hint">Dica: monte uma coluna nova na tabela para o ponto médio e outra para f × m.</div></div>
<div class="tbl"><table>
<tr><th>Horas</th><th>f</th><th>m</th><th>f × m</th><th>%</th></tr>
<tr><td>0 ├ 2</td><td>5</td><td>1</td><td>5</td><td>25%</td></tr>
<tr><td>2 ├ 4</td><td>8</td><td>3</td><td>24</td><td>40%</td></tr>
<tr><td>4 ├ 6</td><td>5</td><td>5</td><td>25</td><td>25%</td></tr>
<tr><td>6 ├ 8</td><td>2</td><td>7</td><td>14</td><td>10%</td></tr>
<tr><th>Total</th><th>20</th><th></th><th>68</th><th>100%</th></tr>
</table></div>
<div class="warn"><b>Erros comuns:</b> somar os pontos médios e dividir pelo número de classes (ignora as frequências); ou dividir pela soma dos pontos médios em vez do total de pessoas.</div>
<div class="tip"><b>Ligação com a missão 8:</b> esta conta é exatamente a média ponderada. O ponto médio é o "valor" e a frequência é o "peso".</div>
`,
quiz:[
{q:'Qual é o ponto médio da classe 6 ├ 12?',o:['9','6','18','3'],a:0,e:'(6 + 12) ÷ 2 = 9.'},
{q:'Classes: 0├4: 3 pessoas · 4├8: 5 · 8├12: 2. Qual é a média?',o:['5,6','6','18','4'],a:0,e:'Pontos médios 2, 6 e 10: (3·2 + 5·6 + 2·10) ÷ 10 = (6 + 30 + 20) ÷ 10 = 5,6.'},
{q:'Por que usamos o ponto médio?',o:['Porque não sabemos o valor exato de cada pessoa na classe','Porque é sempre o valor mais frequente','Porque deixa a conta exata','Porque é a regra da porcentagem'],a:0,e:'O ponto médio representa a classe inteira quando só temos a tabela. Por isso o resultado é aproximado.'},
{q:'Numa pesquisa com 20 pessoas, uma classe tem frequência 4. Qual é a porcentagem?',o:['20%','4%','40%','5%'],a:0,e:'4 ÷ 20 × 100 = 20%.'}
]}
];

/* ============ AVALIAÇÃO FINAL (20 questões, 0,5 cada) ============ */
var FINAL=[
{m:'m1',q:'Qual é o grau de $3x^5 − x^2 + 8$?',o:['5','8','3','2'],a:0,e:'Maior expoente: 5.'},

{m:'m2',q:'$(2x − 1)(x + 4)$ é igual a:',o:['$2x^2 + 7x − 4$','$2x^2 + 8x − 4$','$2x^2 − 4$','$2x^2 + 9x − 4$'],a:0,e:'$2x^2 + 8x − x − 4 = 2x^2 + 7x − 4$.'},

  '<div class="card"><h3 style="margin-top:0">Médias</h3><ul class="l"><li>Aritmética: soma ÷ quantidade</li><li>Ponderada: Σ(valor × peso) ÷ Σ pesos</li><li>Uma média fica sempre entre o menor e o maior valor</li></ul></div>'+
  '<div class="card"><h3 style="margin-top:0">Tabelas</h3><ul class="l"><li>a ├ b: inclui a, exclui b</li><li>% = f ÷ total × 100</li><li>Ponto médio = $@f{a + b}{2}$</li><li>Média da tabela = Σ(f × m) ÷ total</li><li>Soma das frequências = total</li></ul></div></div>')+
  '<div class="row"><button class="btn ghost" onclick="window.print()">Imprimir este resumo</button></div></div>';
}

document.querySelectorAll('.stepper').forEach(function(s){

/* utilidades */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* quizzes das missões */
function buildQuiz(mid){
  var mi=MISSIONS.filter(function(m){return m.id===mid;})[0];
  var box=document.querySelector('[data-quiz="'+mid+'"]');
  var sc=document.getElementById('sc-'+mid); sc.classList.remove('show');
  var answered=0, right=0, h='';
  var order=mi.quiz.map(function(q){ return shuffle(q.o.map(function(t,i){return {t:t,c:i===q.a};})); });
  mi.quiz.forEach(function(q,k){
    h+='<div class="qq"><div class="qn">Questão '+(k+1)+' de '+mi.quiz.length+'</div><div class="qt">'+M(q.q)+'</div><div class="opts">';
    order[k].forEach(function(op,j){ h+='<button class="opt" data-k="'+k+'" data-j="'+j+'">'+M(op.t)+'</button>'; });
    h+='</div><div class="fb" id="fb-'+mid+'-'+k+'"></div></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){
      var k=+b.dataset.k, j=+b.dataset.j, op=order[k][j];
      var btns=box.querySelectorAll('.opt[data-k="'+k+'"]');
      btns.forEach(function(x,jj){ x.disabled=true; if(order[k][jj].c) x.classList.add('right'); });
      var fb=document.getElementById('fb-'+mid+'-'+k);
      if(op.c){ right++; fb.className='fb ok show'; fb.innerHTML='<b>Acertou!</b> '+M(mi.quiz[k].e); }
      else { b.classList.add('wrong'); fb.className='fb no show'; fb.innerHTML='<b>Ainda não.</b> '+M(mi.quiz[k].e); }
      answered++;
      if(answered===mi.quiz.length){
        var n=mi.quiz.length, pass=right>=Math.min(4,n-1);
        state.done[mid]=true; state.best[mid]=Math.max(state.best[mid]||0,right); save(); refresh();
        sc.innerHTML='<div class="n">'+right+' de '+n+'</div><p>'+(right===n?'Perfeito! Missão concluída com estrela. ⭐':pass?'Muito bom! Pode seguir para a próxima missão. Antes, releia a explicação das que errou.':'Vale reforçar: releia os exemplos resolvidos (tente cada passo antes de revelar) e refaça o quiz.')+'</p>';
        sc.classList.add('show');
      }
    });
  });
}
MISSIONS.forEach(function(m){ buildQuiz(m.id); });
document.querySelectorAll('[data-redo]').forEach(function(b){ b.addEventListener('click',function(){ buildQuiz(b.dataset.redo); b.closest('.view').querySelector('.quiz').scrollIntoView({behavior:'smooth'}); }); });

/* progresso e trilha */
function refresh(){
  var n=0;
  MISSIONS.forEach(function(m){
    var st=document.getElementById('st-'+m.id); var d=state.done[m.id], s=(state.best[m.id]||0)===m.quiz.length;
    if(d) n++;
    st.className='st'+(s?' star':d?' done':''); st.textContent=s?'★':d?'✓':'';
  });
  document.getElementById('pbar').style.width=(n*10)+'%';
  document.getElementById('ptxt').textContent=n+' de 10 missões'+(state.final!==null&&state.final!==undefined?' · melhor nota final: '+String(state.final).replace('.',','):'');
  var t='';
  MISSIONS.forEach(function(m,i){
    var d=state.done[m.id], s=(state.best[m.id]||0)===m.quiz.length;
    t+='<button class="tcard'+(s?' star':d?' done':'')+'" data-go="'+m.id+'"><span class="num">'+(s?'★':d?'✓':(i+1))+'</span><span><span class="tt">'+m.titulo+
      (m.bloco==='B'&&!m.hard?'<span class="badge core">principal</span>':'')+(m.hard?'<span class="badge hard">desafio</span>':'')+
      '</span><br><span class="td">'+m.aula+' · '+m.desc+(d?' · melhor: '+state.best[m.id]+'/'+m.quiz.length:'')+'</span></span></button>';
  });
  t+='<button class="tcard" data-go="avaliacao"><span class="num">🎯</span><span><span class="tt">Avaliação final</span><br><span class="td">20 questões · nota de 0 a 10</span></span></button>';
  document.getElementById('trail').innerHTML=t;
}
refresh();

(function(){
  var deck=CARDS.map(function(c,i){return i;}), pos=0, known={};
  var fc=document.getElementById('fc');

    document.getElementById('fcf').innerHTML=M(c[0]); document.getElementById('fcb').innerHTML=M(c[1]);
    document.getElementById('fcn').textContent='cartão '+(pos+1)+' de '+deck.length;
    var k=Object.keys(known).filter(function(x){return known[x];}).length;
    document.getElementById('fcStat').textContent='Você lembrou de '+k+' de '+CARDS.length+' cartões nesta rodada.'; }
  fc.addEventListener('click',function(){ fc.classList.toggle('flip'); });
  document.getElementById('fcPrev').onclick=function(){ pos=(pos-1+deck.length)%deck.length; show(); };
  document.getElementById('fcYes').onclick=function(){ known[deck[pos]]=true; pos=(pos+1)%deck.length; show(); };
  document.getElementById('fcNo').onclick=function(){ known[deck[pos]]=false; deck.push(deck[pos]); deck.splice(pos,1); show(); };

/* jogo: qual é o fator? */
(function(){
  var round=1, hits=0, cur=null;
  function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function pw(a,e){ return e===1?String(a):a+'^{'+e+'}'; }
  function gen(){
    var t=pick(['q','c','n','n','cj','cj2']), den, cor, cand=[], exp;
    if(t==='q'){ var a=pick([2,3,5,6,7,10,11,13]); den='@r{'+a+'}'; cor='@r{'+a+'}';
      cand=[String(a),'@r[3]{'+a+'}','@r{'+(2*a)+'}']; exp='Raiz quadrada sozinha: multiplique por ela mesma, pois $@r{'+a+'}·@r{'+a+'} = '+a+'$.'; }
    else if(t==='c'||t==='n'){ var n=t==='c'?3:ri(4,7), a2=pick([2,3,5,7]), m=ri(1,n-1);
      den='@r['+n+']{'+pw(a2,m)+'}'; cor='@r['+n+']{'+pw(a2,n-m)+'}';
      cand=['@r['+n+']{'+pw(a2,m)+'}','@r['+n+']{'+pw(a2,n)+'}','@r{'+pw(a2,n-m)+'}'];
      if(n-m+1<n) cand.push('@r['+n+']{'+pw(a2,n-m+1)+'}'); if(n-m-1>=1) cand.push('@r['+n+']{'+pw(a2,n-m-1)+'}');
      exp='Índice '+n+', expoente '+m+' → falta '+(n-m)+'. Assim fica $@r['+n+']{'+a2+'^{'+n+'}} = '+a2+'$.'; }
    else if(t==='cj'){ var p=shuffle([2,3,5,6,7,10,11]), x=p[0], y=p[1], plus=Math.random()<.5;
      den='@r{'+x+'} '+(plus?'+':'−')+' @r{'+y+'}'; cor='@r{'+x+'} '+(plus?'−':'+')+' @r{'+y+'}';
      cand=[den,'@r{'+(plus?x+y:Math.abs(x-y)||x*y)+'}','@r{'+x+'}','@r{'+(x*y)+'}'];
      exp='Conjugado: troca o sinal do meio. Produto: $'+x+' − '+y+' = '+(x-y)+'$, sem raiz.'; }
    else { var c=ri(1,5), a3=pick([2,3,5,6,7,10]), pl=Math.random()<.5;
      den=c+' '+(pl?'+':'−')+' @r{'+a3+'}'; cor=c+' '+(pl?'−':'+')+' @r{'+a3+'}';
      cand=[den,'@r{'+a3+'}',String(c),'@r{'+(c+a3)+'}'];
      exp='Conjugado: troca o sinal do meio. Produto: $'+(c*c)+' − '+a3+' = '+(c*c-a3)+'$.'; }
    var seen={}; seen[cor]=1; var ds=[];
    cand.forEach(function(d){ if(!seen[d]&&ds.length<3){ seen[d]=1; ds.push(d); } });
    var opts=shuffle([{t:cor,c:true}].concat(ds.map(function(d){return {t:d,c:false};})));
    return {den:den,opts:opts,exp:exp};
  }
  var best=null; try{ best=+localStorage.getItem(KEY+'-game')||null; }catch(e){}
  function draw(){
    document.getElementById('gr').textContent=round; document.getElementById('ga').textContent=hits;
    document.getElementById('gb').textContent=best?best+'/10':'–';
    cur=gen();
    document.getElementById('gq').innerHTML=M('Para racionalizar $@f{1}{'+cur.den+'}$, multiplico em cima e embaixo por:');
    var go_=document.getElementById('go'); go_.innerHTML='';
    cur.opts.forEach(function(o){ var b=document.createElement('button'); b.className='opt'; b.innerHTML=M('$'+o.t+'$');
      b.onclick=function(){ go_.querySelectorAll('.opt').forEach(function(x,i){ x.disabled=true; if(cur.opts[i].c) x.classList.add('right'); });
        var f=document.getElementById('gf');
        if(o.c){ hits++; f.className='fb ok show'; f.innerHTML='<b>Isso!</b> '+M(cur.exp); } else { b.classList.add('wrong'); f.className='fb no show'; f.innerHTML='<b>Não é esse.</b> '+M(cur.exp); }
        document.getElementById('ga').textContent=hits;
        var nb=document.getElementById('gn'); nb.style.display='inline-block'; nb.textContent=round<10?'Próxima →':'Ver resultado';
      }; go_.appendChild(b); });
    document.getElementById('gf').className='fb'; document.getElementById('gn').style.display='none';
  }
  document.getElementById('gn').onclick=function(){
    if(round<10){ round++; draw(); return; }
    if(!best||hits>best){ best=hits; try{ localStorage.setItem(KEY+'-game',String(best)); }catch(e){} }
    document.getElementById('gq').innerHTML='<b>Fim de jogo: '+hits+' de 10.</b> '+(hits>=9?'Excelente, você domina os fatores!':hits>=6?'Bom! Jogue de novo para passar de 9.':'Revise as missões 3 a 6 e tente de novo.');
    document.getElementById('go').innerHTML=''; document.getElementById('gf').className='fb'; this.style.display='none';
    document.getElementById('gb').textContent=best+'/10';
  };
  document.getElementById('gs').onclick=function(){ round=1; hits=0; draw(); };
  draw();
})();

/* caça ao erro */
function bindErrors(){
  document.querySelectorAll('[data-err]').forEach(function(ul){
    var k=+ul.dataset.err, er=ERRORS[k];
    ul.querySelectorAll('button').forEach(function(b){
      b.disabled=false; b.className='';
      b.onclick=function(){ var j=+b.dataset.step; var f=document.getElementById('ef-'+k);
        ul.querySelectorAll('button').forEach(function(x){ x.disabled=true; if(+x.dataset.step===er.w) x.classList.add('right'); });
        if(j===er.w){ f.className='fb ok show'; f.innerHTML='<b>Achou!</b> '+M(er.e); } else { b.classList.add('wrong'); f.className='fb no show'; f.innerHTML='<b>Esse passo está certo.</b> O erro está no passo '+(er.w+1)+'. '+M(er.e); } };
    });
    document.getElementById('ef-'+k).className='fb';
  });
}
bindErrors(); document.getElementById('erReset').onclick=bindErrors;

/* avaliação final */
(function(){
  var order, sel;
  function build(){
    order=FINAL.map(function(q){ return shuffle(q.o.map(function(t,i){return {t:t,c:i===q.a};})); }); sel={};
    var h='';
    FINAL.forEach(function(q,k){
      h+='<div class="qq"><div class="qn">Questão '+(k+1)+' de 20</div><div class="qt">'+M(q.q)+'</div><div class="opts">';
      order[k].forEach(function(o,j){ h+='<button class="opt" data-fk="'+k+'" data-fj="'+j+'">'+M(o.t)+'</button>'; });
      h+='</div><div class="fb" id="ff-'+k+'"></div></div>';
    });
    var box=document.getElementById('finalBox'); box.innerHTML=h;
    box.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ var k=+b.dataset.fk; sel[k]=+b.dataset.fj;
      box.querySelectorAll('[data-fk="'+k+'"]').forEach(function(x){ x.classList.toggle('sel',x===b); }); }; });
    document.getElementById('fSend').style.display='inline-block'; document.getElementById('fRedo').style.display='none';
    document.getElementById('fScore').classList.remove('show');
  }
  document.getElementById('fSend').onclick=function(){
    var miss=FINAL.filter(function(_,k){return sel[k]===undefined;}).length;
    if(miss>0 && !confirm('Faltam '+miss+' questão(ões) sem resposta. Entregar mesmo assim?')) return;
    var right=0, weak={};
    FINAL.forEach(function(q,k){
      var box=document.getElementById('finalBox');
      box.querySelectorAll('[data-fk="'+k+'"]').forEach(function(x,j){ x.disabled=true; x.classList.remove('sel');
        if(order[k][j].c) x.classList.add('right'); else if(sel[k]===j) x.classList.add('wrong'); });
      var ok=sel[k]!==undefined && order[k][sel[k]].c; if(ok) right++; else weak[q.m]=(weak[q.m]||0)+1;
      var f=document.getElementById('ff-'+k); f.className='fb show '+(ok?'ok':'no'); f.innerHTML='<b>'+(ok?'Certo.':'Errado.')+'</b> '+M(q.e);
    });
    var nota=right/2; state.final=Math.max(state.final||0,nota); save(); refresh();
    var rev=Object.keys(weak).map(function(id){ var i=MISSIONS.findIndex(function(m){return m.id===id;}); return '<button class="btn ghost" data-go="'+id+'" style="margin:4px 4px 0 0">Missão '+(i+1)+': '+MISSIONS[i].titulo+'</button>'; }).join('');
    var s=document.getElementById('fScore');
    s.innerHTML='<div class="n">Nota '+String(nota).replace('.',',')+'</div><p>'+right+' acertos em 20 questões. '+
      (nota>=9?'Excelente! Você está pronto para a prova.':nota>=7?'Bom resultado! Revise os pontos abaixo para chegar perto do 10.':nota>=5?'Está no caminho. Revise as missões abaixo e refaça a avaliação.':'Calma: refaça as missões abaixo com o método dos 4 passos e tente de novo.')+
      '</p>'+(rev?'<p><b>Para revisar:</b></p>'+rev:'');
    s.classList.add('show'); this.style.display='none'; document.getElementById('fRedo').style.display='inline-block';
    s.scrollIntoView({behavior:'smooth'});
  };
  document.getElementById('fRedo').onclick=function(){ build(); window.scrollTo({top:0,behavior:'smooth'}); };
  build();
})();
